# OpenCS Labs -- FastAPI backend.
#
# Two replicas behind a ClusterIP Service. The application is stateless apart
# from PostgreSQL/MinIO/JupyterHub, so replicas are freely interchangeable; the
# launch rate limiter is in-process (backend/app/core/rate_limit.py) and is a
# safety valve rather than a correctness boundary, so 2 replicas each hold their
# own window. Scale this Deployment with the HPA once measured, not before.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencs-backend
  namespace: opencs
  labels:
    app.kubernetes.io/part-of: opencs
    app.kubernetes.io/name: opencs-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the current replica count during a rollout: the UI and
      # JupyterHub launch orchestration must stay available.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opencs-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: opencs
        app.kubernetes.io/name: opencs-backend
        app.kubernetes.io/component: api
        app.kubernetes.io/version: "1.0.0"
      annotations:
        # Prometheus scrape configuration (see monitoring/servicemonitor.yaml).
        # The ServiceMonitor is authoritative; these keep bare Prometheus or
        # annotation-based discovery working too.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # FastAPI handles SIGTERM gracefully; 30s covers in-flight requests plus
      # connection draining in the JupyterHub client.
      terminationGracePeriodSeconds: 30
      # Spread replicas across nodes so a single node loss cannot take the API
      # down entirely.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: opencs-backend
      containers:
        - name: backend
          image: opencs/backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: opencs-config
            - secretRef:
                name: opencs-secrets
          env:
            # Read-only serving tree, shared with notebook pods. The backend
            # only reads it (dataset previews and snippet generation).
            - name: OPENCE_DATASET_SERVING_DIR
              value: /opt/opencs/datasets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          # /health is a pure liveness signal: it must not depend on the
          # database, or a database blip would restart a healthy process.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          # /ready executes `SELECT 1`, so it gates traffic on the database.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: datasets
              mountPath: /opt/opencs/datasets
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: datasets
          persistentVolumeClaim:
            claimName: opencs-datasets
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: opencs-backend
  namespace: opencs
  labels:
    app.kubernetes.io/part-of: opencs
    app.kubernetes.io/name: opencs-backend
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: opencs-backend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
