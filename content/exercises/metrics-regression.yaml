        r2 = None   # TODO
        mae = None  # TODO
        rmse = None # TODO
        print(r2, mae, rmse)
    - source: |
        baseline_mae = None  # TODO: predict y_train.mean() for every test row
        rmse_reason = ""     # TODO: one sentence
