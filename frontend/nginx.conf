# OpenCS Labs — static frontend.
#
# One browser origin fronts everything:
#   /            → the React SPA
#   /api/        → the FastAPI backend
#   /user/ /hub/ → the JupyterHub proxy (single-user servers and Hub UI)
#
# BACKEND_HOST / BACKEND_PORT / HUB_HOST / HUB_PORT are substituted at container
# start by the nginx image's envsubst entrypoint. NGINX_ENVSUBST_FILTER is
# limited to those names so nginx runtime variables ($host, $uri, ...) survive.

# Upstreams use variables so Docker's embedded DNS resolves them at request
# time (a service that restarts gets a new IP).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # API proxy — keep the /api prefix, the backend owns it.
    location /api/ {
        set $backend "http://${BACKEND_HOST}:${BACKEND_PORT}";
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # JupyterHub proxy: the Hub UI (/hub/...) and every single-user server
    # (/user/<name>/...). Without this the launch URL handed to the browser
    # would fall through to the SPA and show the app instead of the notebook.
    #
    # Notebooks use WebSockets for kernel traffic, so Upgrade/Connection must be
    # forwarded and buffering disabled; a long read timeout keeps an idle kernel
    # connection from being cut.
    location /hub/ {
        set $hub "http://${HUB_HOST}:${HUB_PORT}";
        proxy_pass $hub;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /user/ {
        set $hub "http://${HUB_HOST}:${HUB_PORT}";
        proxy_pass $hub;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths render the app, which routes client-side.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
