name: CI

# Runs on every pull request and every push to main. On main, a green run also
# packages the release artifact that the Deploy workflow rolls out (ADR-011).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Verify every imported dependency is declared
        run: |
          # Catches packages that happen to be present transitively in a
          # developer venv but are not pinned, which would break the container.
          .venv/bin/python - <<'PY'
          import ast, pathlib, sys

          declared = set()
          for line in pathlib.Path("requirements.txt").read_text().splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              name = line.split("==")[0].split("[")[0].strip().lower()
              declared.add(name.replace("-", "_"))

          stdlib = set(sys.stdlib_module_names)
          local = {"app", "tests", "migrations"}
          missing = set()

          for path in pathlib.Path("app").rglob("*.py"):
              tree = ast.parse(path.read_text(), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      modules = [alias.name.split(".")[0] for alias in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      modules = [node.module.split(".")[0]] if node.module else []
                  else:
                      continue
                  for module in modules:
                      key = module.lower().replace("-", "_")
                      if key in stdlib or key in local or key in declared:
                          continue
                      # Distribution name differs from import name for a few.
                      aliases = {
                          "jwt": "pyjwt",
                          "pydantic_settings": "pydantic_settings",
                          "psycopg": "psycopg",
                          "prometheus_client": "prometheus_client",
                          "yaml": "pyyaml",
                          "nbformat": "nbformat",
                      }
                      if aliases.get(key) in declared:
                          continue
                      missing.add(module)

          if missing:
              print("undeclared imports:", ", ".join(sorted(missing)), file=sys.stderr)
              sys.exit(1)
          print("all imports are declared")
          PY
      - name: Tests
        run: .venv/bin/pytest -q

  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validators
        run: pip install -r backend/requirements.txt PyYAML pandas pyarrow openpyxl
      - name: Validate curriculum and exercises
        run: python scripts/validate_content.py
      # The serving tree is built, not committed: build it, then verify it.
      - name: Build the dataset library
        run: python scripts/fetch_datasets.py
      - name: Verify dataset manifests against serving files
        run: python scripts/sync_datasets.py --skip-upload

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --include=dev
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm run test -- --run
      - name: Build
        run: npm run build

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate raw Kubernetes manifests, compose and JSON
        run: |
          pip install PyYAML
          python - <<'PY'
          import glob, json, os, sys, yaml

          errors = 0
          # Helm templates contain Go directives and are only valid once
          # rendered, so they are excluded here and checked with `helm template`.
          plain = [
              p for p in glob.glob("infrastructure/kubernetes/**/*.yaml", recursive=True)
          ] + [
              p for p in glob.glob("infrastructure/monitoring/**/*.yaml", recursive=True)
          ] + [
              p for p in glob.glob("infrastructure/policies/**/*.yaml", recursive=True)
          ] + [
              p for p in glob.glob("infrastructure/storage/**/*.yaml", recursive=True)
          ] + ["docker-compose.yml"]

          for path in plain:
              try:
                  list(yaml.safe_load_all(open(path)))
              except Exception as exc:
                  errors += 1
                  print(f"YAML ERROR {path}: {exc}", file=sys.stderr)

          for path in (
              glob.glob("infrastructure/**/*.json", recursive=True)
              + glob.glob("content/**/*.json", recursive=True)
          ):
              try:
                  json.load(open(path))
              except Exception as exc:
                  errors += 1
                  print(f"JSON ERROR {path}: {exc}", file=sys.stderr)

          print(f"validated {len(plain)} manifests")
          sys.exit(1 if errors else 0)
          PY
      - name: Render the Helm chart
        uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint infrastructure/helm/opencs
      - name: Helm template
        run: helm template opencs infrastructure/helm/opencs --namespace opencs > /dev/null

  notebook-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate grade runner compiles
        run: python3 -m py_compile notebook-image/grade_runner.py
      - name: Validate JupyterHub config compiles
        run: |
          python3 -m py_compile jupyterhub/jupyterhub_config.py
          python3 -m py_compile jupyterhub/opencs_auth.py

  jupyterlab-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jupyterlab-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --include=dev --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npx tsc
      - name: Enforce the no-execution contract
        run: |
          # ADR-005: inserting a dataset cell must never execute it. A
          # `requestExecute` call in the compiled output would break that.
          if grep -rn "requestExecute" lib/ src/ --include="*.js" --include="*.ts" \
               | grep -v "^\S*:[0-9]*: \*" | grep -v "^\S*:[0-9]*://"; then
            echo "ERROR: requestExecute found in the extension source" >&2
            exit 1
          fi
          echo "contract holds: no kernel execution in the extension"

  # Migrations against the production engine (the unit tests use SQLite).
  migrations-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opencs
          POSTGRES_PASSWORD: opencs
          POSTGRES_DB: opencs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opencs" --health-interval 5s
          --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      OPENCE_DATABASE_URL: postgresql+psycopg://opencs:opencs@127.0.0.1:5432/opencs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Upgrade to head
        run: alembic upgrade head
      - name: Downgrade and re-upgrade the latest two revisions
        run: |
          alembic downgrade -2
          alembic upgrade head
      - name: Models and migrations agree
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, inspect
          import os
          import app.db.registry  # noqa: F401  (registers every model)
          from app.db.base import Base
          inspector = inspect(create_engine(os.environ["OPENCE_DATABASE_URL"]))
          missing = []
          for table in Base.metadata.sorted_tables:
              if not inspector.has_table(table.name):
                  missing.append(table.name); continue
              columns = {c["name"] for c in inspector.get_columns(table.name)}
              missing += [f"{table.name}.{c.name}" for c in table.columns if c.name not in columns]
          if missing:
              raise SystemExit(f"model columns missing from migrated schema: {missing}")
          print("schema matches models")
          PY

  # The 12-node deployment tooling: syntax, lint and a full config render.
  deploy-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck -S warning deploy/distributed/deploy.sh deploy/distributed/node/*.sh
      - name: Python compiles
        run: python3 -m py_compile deploy/distributed/render.py deploy/distributed/node/agent.py deploy/distributed/monitoring/config.py
      - name: Render every node's configuration (throwaway secrets)
        env:
          OPENCS_SECRETS_DIR: ${{ runner.temp }}/secrets
        run: |
          python3 deploy/distributed/render.py
          python3 - <<'PY'
          import json, pathlib
          build = pathlib.Path("deploy/distributed/build")
          for path in list(build.glob("*/dashboards/*.json")) + list(build.glob("*/*.yml")) + list(build.glob("*/grafana-provisioning/*/*.yaml")):
              text = path.read_text()
              json.loads(text.split("\n", 1)[1] if text.startswith("#") else text)
          print("dashboards, scrape config, alert rules and provisioning are valid")
          PY
      - name: nginx accepts the rendered edge config
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nginx-core >/dev/null
          root=$(mktemp -d); mkdir -p "$root"/{env,run,logs,tmp/client,tmp/proxy,tmp/fastcgi,tmp/uwsgi,tmp/scgi,frontend}
          sed "s#/home/student/opencs#$root#g" deploy/distributed/build/edge/edge.conf > "$root/env/edge.conf"
          for f in api-proxy.inc nb-proxy.inc; do cp deploy/distributed/build/edge/$f "$root/env/"; done
          nginx -p "$root" -c "$root/env/edge.conf" -t

  # Release artifact for the Deploy workflow (main only, after every check).
  package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, content, frontend, manifests, notebook-image, jupyterlab-extension, migrations-postgres, deploy-tooling]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build tools
        run: |
          python -m venv "$RUNNER_TEMP/jlab"
          "$RUNNER_TEMP/jlab/bin/pip" install -q "jupyterlab==4.6.6" -r backend/requirements.txt
      - name: Package release
        env:
          JLAB_VENV: ${{ runner.temp }}/jlab
          PYTHON_BIN: ${{ runner.temp }}/jlab/bin/python
          OPENCS_ARTIFACTS: ${{ runner.temp }}/release
        run: deploy/distributed/deploy.sh package
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/release
          retention-days: 30
          if-no-files-found: error
