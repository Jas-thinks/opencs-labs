hints:
  - "Multiply the two columns directly: `retail[\"quantity\"] * retail[\"unit_price\"]`."
  - "Use `.agg(invoices=(\"invoice_no\", \"count\"), units=(\"quantity\", \"sum\"), revenue=(\"revenue\", \"sum\"))`."
  - "Sort or use `.revenue.idxmax()` to find the largest country."
evaluation:
  type: python_assertions
  timeout_seconds: 75
  tests:
    - id: revenue-derived
      description: revenue equals quantity times unit_price on every row
      code: |
        assert "revenue" in retail.columns, "revenue column missing"
        expected = retail["quantity"] * retail["unit_price"]
        assert (retail["revenue"] - expected).abs().max() < 1e-6
    - id: country-summary
      description: country_summary has the required metrics and correct UK revenue
      code: |
        assert country_summary is not None
        assert {"invoices", "units", "revenue"}.issubset(country_summary.columns)
        assert abs(float(country_summary.loc["United Kingdom", "revenue"]) - 294981.24) < 1.0
    - id: totals
      description: total revenue and top country are correct
      code: |
        assert abs(float(total_revenue) - 351237.72) < 1.0, total_revenue
        assert str(top_country) == "United Kingdom", top_country
