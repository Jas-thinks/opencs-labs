# OpenCS Labs -- RBAC for the grading sandbox.
#
# The backend creates one short-lived batch/v1 Job plus one ConfigMap per
# practice evaluation, waits for it, reads the pod log and deletes both. That is
# the entire permission surface: it cannot read other namespaces, cannot list
# Secrets and cannot touch the platform pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opencs-grader
  namespace: opencs
  labels:
    app.kubernetes.io/part-of: opencs
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opencs-grader
  namespace: opencs-grading
  labels:
    app.kubernetes.io/part-of: opencs
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opencs-grader
  namespace: opencs-grading
  labels:
    app.kubernetes.io/part-of: opencs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opencs-grader
subjects:
  - kind: ServiceAccount
    name: opencs-grader
    namespace: opencs
