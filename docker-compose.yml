name: opencs-labs

# OpenCS Labs — single-host stack for development and small deployments.
#
# Production runs on Kubernetes (see infrastructure/). This composition is a
# faithful, self-contained version of the same architecture:
#   browser → frontend (nginx) → backend (FastAPI) → JupyterHub → notebook pods
#
# DATASETS_SERVING_DIR MUST be an absolute host path. The backend reads the
# dataset files directly, and the grading sandbox bind-mounts the same host
# path into a short-lived container, so both sides must agree on it.
# `make up` exports it automatically; `docker compose up` needs it in .env.
#
# Object storage (MinIO) is OPTIONAL at runtime and therefore behind a profile:
# the catalogue, previews, snippets and notebooks all read the filesystem mount,
# never S3. Only `scripts/sync_datasets.py` (the durable-copy step) speaks S3.
# Start it with:  docker compose --profile storage up -d
#
# NOTE: MinIO images were withdrawn from Docker Hub, so the `storage` profile
# cannot be pulled as written. Production uses MinIO on Kubernetes
# (infrastructure/kubernetes/minio.yaml); for local work, either point the sync
# script at an existing S3 endpoint or skip it — the stack runs without it.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opencs}
      POSTGRES_USER: ${POSTGRES_USER:-opencs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opencs}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opencs} -d ${POSTGRES_DB:-opencs}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    profiles: ["storage"]
    image: ${OPENCE_MINIO_IMAGE:-minio/minio:RELEASE.2024-06-13T22-53-53Z}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OPENCE_S3_ACCESS_KEY:-opencs}
      MINIO_ROOT_PASSWORD: ${OPENCE_S3_SECRET_KEY:-opencs-dev-secret}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    profiles: ["storage"]
    image: ${OPENCE_MINIO_MC_IMAGE:-minio/mc:latest}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${OPENCE_S3_ACCESS_KEY:-opencs}
      MINIO_ROOT_PASSWORD: ${OPENCE_S3_SECRET_KEY:-opencs-dev-secret}
      OPENCE_S3_BUCKET: ${OPENCE_S3_BUCKET:-opencs-datasets}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$OPENCE_S3_BUCKET"
        echo "bucket $$OPENCE_S3_BUCKET ready"
    restart: "no"

  backend:
    build:
      context: ./backend
    image: opencs/backend:1.0.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      OPENCE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-opencs}:${POSTGRES_PASSWORD:-opencs}@postgres:5432/${POSTGRES_DB:-opencs}
      # Only the optional sync script uses object storage. Unset by default so
      # the stack starts without a MinIO container.
      OPENCE_S3_ENDPOINT: ${OPENCE_S3_ENDPOINT:-}
      OPENCE_DATASET_SERVING_DIR: ${DATASETS_SERVING_DIR}
      # Two listeners: the Hub API (/hub/api) on 8081 and the proxy
      # (/user/<name>/) on 8000. Contents calls must use the proxy.
      OPENCE_JUPYTERHUB_URL: http://jupyterhub:8081
      OPENCE_JUPYTERHUB_API_URL: http://jupyterhub:8081/hub/api
      OPENCE_JUPYTERHUB_PROXY_URL: http://jupyterhub:8000
      OPENCE_JUPYTERHUB_PUBLIC_URL: http://localhost:${FRONTEND_HOST_PORT:-5173}
      OPENCE_PUBLIC_ORIGIN: http://localhost:${FRONTEND_HOST_PORT:-5173}
      OPENCE_CORS_ORIGINS: http://localhost:${FRONTEND_HOST_PORT:-5173}
      OPENCE_SEED_ON_START: ${OPENCE_SEED_ON_START:-true}
      OPENCE_GRADER_STAGING_DIR: ${GRADER_STAGING_DIR:-/tmp/opencs-grading}
      PYTHONPATH: /srv/backend
    volumes:
      # Same absolute path inside and out so the grading sandbox can bind-mount it.
      - ${DATASETS_SERVING_DIR}:${DATASETS_SERVING_DIR}:ro
      - ./content:/srv/content:ro
      - ./datasets:/srv/datasets:ro
      - ./scripts:/srv/scripts:ro
      # Grading staging area: identical absolute path inside and on the host so
      # the sibling grading container can bind-mount what the backend staged.
      - ${GRADER_STAGING_DIR:-/tmp/opencs-grading}:${GRADER_STAGING_DIR:-/tmp/opencs-grading}
      - /var/run/docker.sock:/var/run/docker.sock
    # The socket is owned by root:docker on the host; joining that group lets
    # the non-root backend container talk to it. DOCKER_GID is the host's
    # `getent group docker` gid. Production uses OPENCE_GRADER=kubernetes and
    # never mounts the socket.
    group_add:
      - "${DOCKER_GID:-984}"
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
    image: opencs/frontend:1.0.0
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "8000"
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"

  jupyterhub:
    build:
      context: ./jupyterhub
    image: opencs/jupyterhub:1.0.0
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      # Single-host deployment uses DockerSpawner; Kubernetes uses KubeSpawner.
      OPENCE_SPAWNER: docker
      OPENCE_JUPYTERHUB_PUBLIC_URL: http://localhost:${FRONTEND_HOST_PORT:-5173}
      OPENCE_NOTEBOOK_IMAGE: ${OPENCE_NOTEBOOK_IMAGE:-opencs/analytics:1.0.0}
      OPENCE_DATASET_SERVING_DIR: ${DATASETS_SERVING_DIR}
      DOCKER_NETWORK_NAME: opencs-labs_default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATASETS_SERVING_DIR}:${DATASETS_SERVING_DIR}:ro
      - hub-data:/srv/jupyterhub/data
    ports:
      # The proxy is the public listener (9000 on the host to avoid clashing with
      # other local services); the Hub API on 8081 is internal to the network.
      - "${JUPYTERHUB_HOST_PORT:-9000}:8000"

volumes:
  postgres-data:
  minio-data:
  hub-data:
