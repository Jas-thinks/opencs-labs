datasets: [titanic]
related_lesson: logistic-regression
objective: Train a probabilistic classifier, inspect probabilities and apply a custom threshold.
instructions:
  markdown: |
    Using the prepared Titanic features, fit a logistic regression.

    Produce:

    * `model` — fitted on the training split.
    * `accuracy` — test accuracy.
    * `probas` — predicted survival probabilities for the test set.
    * `n_at_03` — number of test passengers predicted positive at threshold 0.3.
starter_notebook:
  intro_markdown: |
    # Logistic Regression for Survival

    **Objective:** distinguish probabilities from classes and change the threshold deliberately.
  cells:
    - source: |
        import pandas as pd
        from sklearn.model_selection import train_test_split
        from sklearn.linear_model import LogisticRegression
        from sklearn.metrics import accuracy_score

        df = pd.read_csv("/opt/opencs/datasets/titanic/v1/titanic.csv")
        data = df[["survived", "pclass", "sex", "age", "fare", "sibsp", "parch"]].copy()
        data["sex"] = (data["sex"] == "female").astype(int)
        data["age"] = data["age"].fillna(data["age"].median())
        data["fare"] = data["fare"].fillna(data["fare"].median())
        X = data.drop(columns="survived")
        y = data["survived"]
        X_train, X_test, y_train, y_test = train_test_split(
            X, y, test_size=0.25, random_state=42, stratify=y
        )
