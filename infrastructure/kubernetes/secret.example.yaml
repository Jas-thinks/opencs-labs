# OpenCS Labs -- Secret template.
#
# ############################################################################
# NEVER COMMIT REAL VALUES. This file contains deliberate `REPLACE_ME`
# placeholders only and exists to document the exact set of keys the platform
# consumes. It is NOT applied by any kustomization; it is a reference.
#
# Create the real Secret out-of-band instead, e.g.:
#
#   kubectl -n opencs create secret generic opencs-secrets \
#     --from-literal=OPENCE_JWT_SECRET="$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')" \
#     --from-literal=OPENCE_JUPYTERHUB_API_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=OPENCE_DATABASE_URL="postgresql+psycopg://opencs:<pw>@postgres.opencs.svc.cluster.local:5432/opencs" \
#     --from-literal=OPENCE_S3_ACCESS_KEY="<minio-access-key>" \
#     --from-literal=OPENCE_S3_SECRET_KEY="<minio-secret-key>" \
#     --from-literal=OPENCE_OIDC_CLIENT_SECRET="<oidc-client-secret>" \
#     --from-literal=POSTGRES_PASSWORD="<same-password-as-in-database-url>" \
#     --from-literal=MINIO_ROOT_USER="<minio-root-user>" \
#     --from-literal=MINIO_ROOT_PASSWORD="<minio-root-password>"
#
# In production prefer an External Secrets Operator (or equivalent) object
# sourcing from Vault / AWS Secrets Manager / Sealed Secrets so that the
# plaintext never touches a developer workstation:
#
#   apiVersion: external-secrets.io/v1beta1
#   kind: ExternalSecret
#   metadata:
#     name: opencs-secrets
#     namespace: opencs
#   spec:
#     secretStoreRef:
#       name: platform-vault
#       kind: ClusterSecretStore
#     target:
#       name: opencs-secrets
#     dataFrom:
#       - extract:
#           key: opencs/production
# ############################################################################
apiVersion: v1
kind: Secret
metadata:
  name: opencs-secrets
  namespace: opencs
  labels:
    app.kubernetes.io/part-of: opencs
    app.kubernetes.io/name: opencs-backend
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # --- Application secrets ------------------------------------------------
  # HS256 signing key for the OpenCS session JWT. JupyterHub's OpenCS
  # authenticator validates the same token, which is how single sign-on works.
  # Minimum 32 characters; production startup rejects weak values.
  # Generate: python -c "import secrets; print(secrets.token_urlsafe(48))"
  OPENCE_JWT_SECRET: "REPLACE_ME"

  # JupyterHub admin API token. Only the backend process holds this; it is
  # never returned to browser JavaScript.
  OPENCE_JUPYTERHUB_API_TOKEN: "REPLACE_ME"

  # SQLAlchemy URL with the psycopg driver. Host must match the postgres
  # Service (postgres.opencs.svc.cluster.local:5432) and database `opencs`.
  OPENCE_DATABASE_URL: "REPLACE_ME"

  # MinIO / S3-compatible credentials for bucket `opencs-datasets`.
  OPENCE_S3_ACCESS_KEY: "REPLACE_ME"
  OPENCE_S3_SECRET_KEY: "REPLACE_ME"

  # Institutional OIDC provider client secret (paired with the public
  # OPENCE_OIDC_ISSUER in opencs-config).
  OPENCE_OIDC_CLIENT_SECRET: "REPLACE_ME"

  # --- Infrastructure credentials -----------------------------------------
  # Consumed by the postgres StatefulSet (POSTGRES_PASSWORD) via envFrom.
  # Must equal the password embedded in OPENCE_DATABASE_URL above.
  POSTGRES_PASSWORD: "REPLACE_ME"

  # Consumed by the minio StatefulSet; the MinIO root identity is also the
  # pair used by the backend for OPENCE_S3_ACCESS_KEY / OPENCE_S3_SECRET_KEY
  # unless you provision a narrower service account in MinIO.
  MINIO_ROOT_USER: "REPLACE_ME"
  MINIO_ROOT_PASSWORD: "REPLACE_ME"
