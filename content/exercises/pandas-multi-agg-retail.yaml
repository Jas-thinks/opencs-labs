slug: pandas-multi-agg-retail
title: Multi-Column Aggregation on Retail Sales
topic: Pandas
difficulty: Hard
position: 70
estimated_minutes: 25
datasets: [retail-sales]
related_lesson: pandas-groupby-and-joins
objective: Derive revenue, aggregate several metrics per country, and rank groups on a computed measure.
instructions:
  markdown: |
    The retail sample contains invoice lines with `quantity` and `unit_price`.

    1. Add a `revenue` column = `quantity * unit_price`.
    2. Build `country_summary` grouped by `country` with:
       * `invoices` — number of rows,
       * `units` — total quantity,
       * `revenue` — total revenue.
    3. Set `top_country` to the country with the highest revenue.
    4. Set `total_revenue` to the overall revenue across all rows.
