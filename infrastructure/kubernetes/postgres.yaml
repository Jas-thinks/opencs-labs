# OpenCS Labs -- PostgreSQL 16 metadata store.
#
# Stores users, courses, lessons, exercises, dataset catalogue metadata,
# practice attempts and notebook index rows. Binaries never go in here.
#
# Single replica with a 50Gi PVC: adequate for the metadata footprint of 600
# enrolled students. There is no HA/failover here on purpose -- if the course
# needs a database availability SLA, run CloudNativePG (or a managed service)
# instead of scaling this StatefulSet, because two postgres replicas on the
# same ReadWriteOnce volume are not a cluster.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: opencs
  labels:
    app.kubernetes.io/part-of: opencs
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: opencs
  labels:
    app.kubernetes.io/part-of: opencs
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: opencs
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      # Give the database time to flush and shut down cleanly.
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          # The official image requires PGDATA to be a subdirectory of the
          # mount point: `lost+found` and volume-root ownership would otherwise
          # stop initdb from running.
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: opencs
            - name: POSTGRES_USER
              value: opencs
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencs-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U opencs -d opencs -h 127.0.0.1 -p 5432
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U opencs -d opencs -h 127.0.0.1 -p 5432
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        # postgres needs writable runtime sockets and a scratch dir.
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: pgdata
        labels:
          app.kubernetes.io/part-of: opencs
          app.kubernetes.io/name: postgres
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
