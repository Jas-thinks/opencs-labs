# OpenCS Labs -- MinIO object storage (S3-compatible).
#
# Canonical store for the dataset library (bucket `opencs-datasets`), lesson
# assets, starter notebooks and backups. Notebook pods never talk to MinIO
# directly: datasets reach them through the read-only artifact produced by
# datasets-pvc.yaml. Only the backend and the dataset sync Job need S3 access.
#
# 200Gi is sized for the full dataset library plus lesson assets and a
# generation of backups; the served Parquet/CSV tree is a few GiB.
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: opencs
  labels:
    app.kubernetes.io/part-of: opencs
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: object-storage
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
      protocol: TCP
    - name: console
      port: 9001
      targetPort: console
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: opencs
  labels:
    app.kubernetes.io/part-of: opencs
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: object-storage
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: opencs
        app.kubernetes.io/name: minio
        app.kubernetes.io/component: object-storage
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-06-13T22-53-53Z
          imagePullPolicy: IfNotPresent
          command:
            - /usr/bin/docker-entrypoint.sh
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - name: api
              containerPort: 9000
              protocol: TCP
            - name: console
              containerPort: 9001
              protocol: TCP
          env:
            # The MinIO root identity is read from the same Secret the backend
            # uses for OPENCE_S3_ACCESS_KEY / OPENCE_S3_SECRET_KEY. For a
            # stricter setup, keep root credentials out of the backend and
            # provision a bucket-scoped MinIO service account instead.
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: opencs-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencs-secrets
                  key: MINIO_ROOT_PASSWORD
            # Single-drive topology (see `server /data` above).
            - name: MINIO_BROWSER_REDIRECT_URL
              value: "https://opencs.example.edu/minio-console"
            # readOnlyRootFilesystem is true, so point HOME at the writable
            # scratch mount (MinIO writes config/certs under $HOME/.minio).
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/part-of: opencs
          app.kubernetes.io/name: minio
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 200Gi
---
# Creates the `opencs-datasets` bucket. Idempotent: `mc mb --ignore-existing`
# is a no-op when the bucket already exists, so this Job can be re-run or
# re-applied after any MinIO restart without failing the release.
#
# The retry loop is required because a Job may be scheduled before MinIO is
# accepting connections -- there is no readiness gate for a plain Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: opencs
  labels:
    app.kubernetes.io/part-of: opencs
    app.kubernetes.io/name: minio-init
    app.kubernetes.io/component: bootstrap
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: opencs
        app.kubernetes.io/name: minio-init
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          image: minio/mc:RELEASE.2024-06-12T14-34-03Z
          imagePullPolicy: IfNotPresent
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: opencs-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencs-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_ENDPOINT
              value: http://minio.opencs.svc.cluster.local:9000
            - name: BUCKET
              value: opencs-datasets
            # The root filesystem is read-only, so `mc` must keep its config
            # in the writable emptyDir mount below instead of $HOME/.mc.
            - name: HOME
              value: /tmp
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              echo "waiting for ${MINIO_ENDPOINT} ..."
              attempt=1
              while [ "${attempt}" -le 60 ]; do
                if mc alias set local "${MINIO_ENDPOINT}" \
                     "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1; then
                  echo "minio is reachable (attempt ${attempt})"
                  break
                fi
                echo "minio not ready yet (attempt ${attempt})"
                attempt=$((attempt + 1))
                sleep 5
              done
              if [ "${attempt}" -gt 60 ]; then
                echo "giving up waiting for minio" >&2
                exit 1
              fi
              mc mb --ignore-existing "local/${BUCKET}"
              # Datasets are published read-only at the bucket policy level;
              # only the backend and the sync Job hold credentials.
              mc anonymous set none "local/${BUCKET}"
              mc ls "local/${BUCKET}"
              echo "bucket ${BUCKET} ready"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: mc-config
              mountPath: /tmp/.mc
      volumes:
        - name: mc-config
          emptyDir: {}
