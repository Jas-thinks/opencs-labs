{{- /*
ServiceAccount for the backend.

The FastAPI process needs no Kubernetes API access -- it talks to PostgreSQL,
MinIO and the JupyterHub REST API over the network, and JupyterHub/KubeSpawner
own pod creation. The token is therefore never mounted: an API credential in
the application pod would be a privilege-escalation path with no upside.

Create it even when `automountServiceAccountToken` is false, so the pod runs
under a named, auditable identity instead of `default`.
*/ -}}
{{- if .Values.backend.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "opencs.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opencs.componentLabels" (dict "root" . "component" (printf "%s-backend" (include "opencs.fullname" .))) | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.backend.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.backend.serviceAccount.automountServiceAccountToken }}
{{- end }}
