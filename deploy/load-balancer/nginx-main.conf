# OpenCS Labs — nginx main configuration (replaces the distro default).
#
# WHY THIS FILE EXISTS: the packaged /etc/nginx/nginx.conf sets
# `worker_processes auto;`, which resolves to the HOST's CPU count (120) even
# though this container is capped at 1 CPU / 512 MiB by cgroup. 120 workers
# exhausts the cgroup, starves sshd ("Connection timed out during banner
# exchange") and makes the load balancer the least reliable part of the stack.
#
# Site config lives in conf.d/opencs.conf; the upstream pool lives in
# conf.d/opencs-upstreams.inc (`.inc` so the conf.d/*.conf glob does not load
# it twice — duplicate upstream names are a config error).

user  www-data;
worker_processes  2;
worker_rlimit_nofile 8192;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # Keep per-connection buffers small: 512 MiB total budget for the container.
    client_body_buffer_size 64k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;
    output_buffers 2 32k;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 30s;

    gzip  on;
    gzip_vary on;

    include /etc/nginx/conf.d/*.conf;
}
