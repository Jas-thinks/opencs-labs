hints:
  - "`confusion_matrix(y_test, predictions)`."
  - "Precision, recall and F1 accept `zero_division=0`."
  - "AUC needs probabilities, not hard classes."
evaluation:
  type: python_assertions
  timeout_seconds: 90
  tests:
    - id: confusion
      description: the confusion matrix matches the expected cells
      code: |
        assert cm.shape == (2, 2), cm
        assert int(cm[0, 0]) == 112 and int(cm[0, 1]) == 25, cm
        assert int(cm[1, 0]) == 24 and int(cm[1, 1]) == 62, cm
    - id: metrics
      description: precision, recall and F1 match the matrix
      code: |
        assert abs(float(precision) - 0.713) < 0.01, precision
        assert abs(float(recall) - 0.721) < 0.01, recall
        assert abs(float(f1) - 0.717) < 0.01, f1
    - id: auc
      description: ROC AUC is about 0.843
      code: |
        assert abs(float(auc) - 0.843) < 0.015, auc
