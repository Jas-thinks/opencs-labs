hints:
  - "`mean_squared_error(...)` returns MSE; take the square root for RMSE."
  - "A constant prediction can be built with `np.full(len(y_test), y_train.mean())`."
  - "RMSE weights large errors more heavily because errors are squared before averaging."
evaluation:
  type: python_assertions
  timeout_seconds: 75
  tests:
    - id: metrics
      description: R², MAE and RMSE match the held-out values
      code: |
        assert abs(float(r2) - 0.524) < 0.02, r2
        assert abs(float(mae) - 58436) < 2000, mae
        assert abs(float(rmse) - 78994) < 3000, rmse
    - id: baseline
      description: baseline MAE is about 90,607
      code: |
        assert abs(float(baseline_mae) - 90607) < 2000, baseline_mae
        assert float(mae) < float(baseline_mae)
    - id: explanation
      description: the explanation mentions large errors and squaring
      code: |
        text = str(rmse_reason).lower()
        assert ("large" in text or "big" in text) and ("squar" in text or "penal" in text), rmse_reason
        assert abs(float(rmse) - float(mae)) > 0
