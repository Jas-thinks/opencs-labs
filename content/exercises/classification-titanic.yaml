hints:
  - "`model.predict_proba(X_test)[:, 1]` selects the positive-class probability."
  - "`accuracy_score(y_test, model.predict(X_test))`."
  - "A threshold is a comparison, not a model method: `(probas >= 0.3).sum()`."
evaluation:
  type: python_assertions
  timeout_seconds: 90
  tests:
    - id: probabilities
      description: probabilities cover the whole test set and are in [0, 1]
      code: |
        assert probas is not None
        assert len(probas) == 223, len(probas)
        assert float(min(probas)) >= 0 and float(max(probas)) <= 1
    - id: accuracy
      description: test accuracy is about 0.78
      code: |
        assert abs(float(accuracy) - 0.78) < 0.02, accuracy
    - id: threshold
      description: exactly 109 passengers are predicted positive at 0.3
      code: |
        assert int(n_at_03) == 109, n_at_03
