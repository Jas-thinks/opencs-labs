name: Deploy

# Production deploy to the 12-node cluster (ADR-011).
#
# * GitHub's cloud runners cannot reach the 10.1.75.x network, so the build
#   happens in CI (the `release` artifact) and this job runs on a self-hosted
#   runner on the edge node (label `opencs-edge`) inside the network.
# * It deploys exactly the artifact CI tested and packaged for that commit.
# * The `production` environment gates it: configure required reviewers in
#   Settings -> Environments -> production, so nothing ships unapproved.
# * Cluster secrets stay on the runner host (~/.opencs-deploy); no password or
#   key is stored in GitHub.
# * Order: ship release -> additive schema migrations -> rolling restart (one
#   API at a time; the edge keeps serving) -> verification. Any failure rolls
#   back to the previous release. Migrations are additive, so the previous code
#   runs on the new schema; they are never auto-reversed.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "CI run id whose `release` artifact to deploy (blank = latest successful run on main)"
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to the cluster
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: [self-hosted, opencs-edge]
    environment:
      name: production
      url: http://10.1.75.53:5305
    timeout-minutes: 30
    env:
      OPENCS_ARTIFACTS: ${{ github.workspace }}/release
    steps:
      - name: Resolve the CI run to deploy
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          INPUT_RUN: ${{ inputs.ci_run_id }}
          EVENT_RUN: ${{ github.event.workflow_run.id }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -n "${EVENT_RUN:-}" ]; then
            echo "id=$EVENT_RUN" >> "$GITHUB_OUTPUT"; echo "sha=$EVENT_SHA" >> "$GITHUB_OUTPUT"; exit 0
          fi
          api() { curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/$1"; }
          if [ -n "${INPUT_RUN:-}" ]; then
            api "actions/runs/$INPUT_RUN" > run.json
          else
            api "actions/workflows/ci.yml/runs?branch=main&status=success&event=push&per_page=1" \
              | python3 -c "import json,sys; json.dump(json.load(sys.stdin)['workflow_runs'][0], open('run.json','w'))"
          fi
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          run = json.load(open("run.json"))
          assert run["conclusion"] == "success", "that CI run did not succeed"
          print(f"id={run['id']}"); print(f"sha={run['head_sha']}")
          PY

      - name: Check out the deployed commit (deploy scripts)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.run.outputs.sha }}

      - name: Download the release artifact built by CI
        uses: actions/download-artifact@v4
        with:
          name: release
          path: release
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}

      - name: Use the runner host's cluster credentials
        run: |
          set -euo pipefail
          test -f "$HOME/.opencs-deploy/cluster.env" || { echo "run deploy.sh runner-setup first" >&2; exit 1; }
          echo "OPENCS_SECRETS_DIR=$HOME/.opencs-deploy" >> "$GITHUB_ENV"
          echo "OPENCS_DEPLOY_KEY=$HOME/.ssh/opencs_runner_ed25519" >> "$GITHUB_ENV"
          echo "OPENCS_KNOWN_HOSTS=$HOME/.opencs-deploy/known_hosts" >> "$GITHUB_ENV"
          test "$(cat release/SHA)" = "$(git rev-parse --short=12 HEAD)" || { echo "artifact/commit mismatch" >&2; exit 1; }

      # On any failure after shipping, `deploy.sh cd` itself rolls every node
      # back to the exact release that was running before (code + frontend).
      - name: Deploy (ship, migrate, rolling restart, verify; auto-rollback)
        run: deploy/distributed/deploy.sh cd

      - name: Cluster status
        if: always()
        run: deploy/distributed/deploy.sh status
