{{- /*
Application credentials.

Two supported modes:

  1. existingSecret != "" (the production default): the chart renders NOTHING
     here and the Deployment consumes that Secret. Create it with
     `kubectl create secret`, External Secrets, Sealed Secrets or Vault. This
     is the recommended mode -- no credential ever passes through values.yaml,
     a `helm --set` flag or Helm's release history.

  2. existingSecret == "" and backend.secret.create == true: render a Secret
     from .Values.backend.secret.data. Intended for lab/staging clusters only.

Render is skipped entirely when backend.secret.create is false, so re-running
`helm upgrade` after the operator has hand-created the Secret never plans to
delete or blank it.
*/ -}}
{{- if and (not .Values.backend.existingSecret) .Values.backend.secret.create -}}
{{- $component := printf "%s-secrets" (include "opencs.fullname" .) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $component }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opencs.componentLabels" (dict "root" . "component" (printf "%s-backend" (include "opencs.fullname" .))) | nindent 4 }}
    app.kubernetes.io/component: secrets
  annotations:
    # Keep the Secret out of `helm get manifest` output and out of diffs.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- range $key, $value := .Values.backend.secret.data }}
  {{ $key }}: {{ required (printf "backend.secret.data.%s must not be empty when backend.secret.create is true (or set backend.existingSecret instead)" $key) $value | quote }}
  {{- end }}
{{- end -}}
