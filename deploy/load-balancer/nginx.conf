# OpenCS Labs — production reverse proxy / load balancer.
#
# One browser origin fronts everything:
#   /            → React SPA (static files)
#   /api/        → FastAPI backends (3 instances, health-aware)
#   /healthz     → this proxy's own health
#
# Upstream membership is defined ONCE in opencs-upstreams.conf so backend
# addresses are not hardcoded in the routing rules (deployment requirement).
#
# Why no /hub/ or /user/ blocks: JupyterHub cannot be deployed on this
# infrastructure (no Docker, no Kubernetes, no systemd), so the application
# runs with OPENCE_NOTEBOOK_BACKEND=local. See the inventory and the final
# report for that limitation. Re-add the Hub blocks when a spawner runtime
# exists.

# .inc (not .conf) so nginx.conf's `conf.d/*.conf` glob does not load the
# upstream block a second time — duplicate upstream names are a config error.
include /etc/nginx/conf.d/opencs-upstreams.inc;

# Access log records $upstream_addr so operations can prove which backend
# served a request (and spot a peer that has been taken out of rotation).
log_format opencs_main '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       'upstream=$upstream_addr '
                       'rt=$request_time urt=$upstream_response_time '
                       'req_id=$request_id';

server {
    listen 80 default_server;
    server_name _;

    access_log /srv/opencs/logs/access.log opencs_main;
    error_log  /srv/opencs/logs/error.log warn;

    root /srv/opencs/frontend;
    index index.html;

    # --- security headers --------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Request-ID $request_id always;

    client_max_body_size 64m;   # notebook uploads and dataset previews
    client_body_timeout 60s;

    # --- compression -------------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # --- load balancer health ---------------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- API ---------------------------------------------------------------
    # Balanced across all three backends. max_fails/fail_timeout make this
    # health-aware: a backend that errors is taken out of rotation and
    # retried after fail_timeout. proxy_next_upstream retries idempotent
    # requests on the next healthy peer, so one dead backend does not fail
    # the request.
    location /api/ {
        proxy_pass http://opencs_backends;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 300s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # Health endpoints are used by the deploy verification, not by browsers.
    location = /ready {
        proxy_pass http://opencs_backends;
        proxy_set_header Host $http_host;
        access_log off;
    }
    location = /health {
        proxy_pass http://opencs_backends;
        proxy_set_header Host $http_host;
        access_log off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA fallback ------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # --- errors ------------------------------------------------------------
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        add_header Content-Type text/html;
        return 503 '<!doctype html><title>OpenCS Labs — temporarily unavailable</title><h1>Service temporarily unavailable</h1><p>The application backends are not reachable. Please retry shortly.</p>';
    }
}
