        print(comparison)
hints:
  - "Pass `eval_set=[(X_val, y_val)]` to `fit`."
  - "`model.best_iteration` is available after fitting with early stopping."
  - "Score on the untouched test split."
evaluation:
  type: python_assertions
  timeout_seconds: 150
  tests:
    - id: fitted
      description: the model is fitted and produced a best iteration
      code: |
        assert model is not None
        assert int(best_iteration) > 0, best_iteration
    - id: no-leakage
      description: early stopping used a validation split
      code: |
        assert used_validation is True, "early stopping must use a validation split, not the test set"
    - id: accuracy
      description: accuracy is in a plausible range for this small dataset
      code: |
        assert 0.72 <= float(accuracy) <= 0.84, accuracy
    - id: comparison
      description: the comparison is honest about the result
      code: |
        text = str(comparison).lower()
        assert "logistic" in text or "similar" in text or "no better" in text, comparison
